[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "treval-ai-nse"
version = "1.0.0"
description = "Live NSE stock screener for Kenya (cloud-hosted)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.116.1",
    "uvicorn[standard]==0.35.0",
    "pydantic==2.11.7",
    "requests==2.32.5",
    "loguru==0.7.3",
]
