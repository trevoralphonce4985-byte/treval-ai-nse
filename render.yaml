services:
  - type: web
    name: treval-ai-nse
    env: python
    region: frankfurt
    plan: free
    pythonVersion: 3.12.10
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    gitBranch: main
